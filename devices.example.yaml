# Copy to ~/.tv-mcp/devices.yaml (or anywhere, then pass --config or set TV_MCP_CONFIG).
# The current directory is NOT searched: buildCmd is executed, so only load configs you trust.

devices:
  - name: lab-samsung-q80
    platform: tizen
    host: 192.168.1.40
    signingProfile: my-partner-profile   # tizen security-profiles list

  - name: lab-lg-c3
    platform: webos
    host: 192.168.1.41
    passphraseEnv: LG_C3_PASSPHRASE      # Dev Mode app passphrase, via env var

projects:
  myapp:
    buildCmd: npm run build            # run WITHOUT a shell (no &&, |, $VAR); or a list: [npm, run, build]
    dist: dist/
    tizen:
      appId: ABCDvxyz12.myapp
      profile: my-partner-profile
    webos:
      appId: com.example.myapp           # must match dist/appinfo.json "id"
